          <div class="archive-head-top">
            <h1 class="jelly-title"><span class="title-last-line"><span class="gradient-title" data-text="WORK ARCHIVE"><span class="gradient-title-text" data-text="WORK ARCHIVE">WORK ARCHIVE</span></span><svg class="h2-sparkle" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><use href="#spShape" fill="currentColor"/></svg></span></h1>

        </div>
        <!-- 필터 툴바: 카테고리 칩(JS가 채움) + 연도·정렬 -->
        <div class="archive-toolbar">
          <div id="archive-filters" class="archive-filters"></div>
          <div class="archive-controls">
            <select id="archive-year" aria-label="연도 필터"></select>
            <select id="archive-month" aria-label="월 필터"></select>
            <select id="archive-sort" aria-label="정렬 방식">
              <option value="new">최신순</option>
              <option value="old">오래된순</option>
            </select>
          </div>
        </div>
        <!-- 작업 카드 목록 (JS가 채움) -->
        <div id="archive-grid" class="archive-state">작업을 불러오는 중이에요 ✦</div>

          <button type="button" class="archive-more" id="archive-more">VIEW MORE <span>✦</span></button>
